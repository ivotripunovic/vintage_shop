{% extends "base.html" %}
{% block title %}Obriši proizvod — {{ SITE_NAME }}{% endblock %}

{% block content %}

<div class="max-w-md mx-auto py-12">
    <h1 class="font-serif text-4xl font-light mb-8 text-center">Obriši proizvod</h1>

    <div class="border border-neutral-200 p-6 mb-6">
        <p class="text-sm text-stone-900 font-medium mb-1">{{ product.title }}</p>
        <p class="text-xs text-red-500">Ova akcija se ne može poništiti.</p>
    </div>

    <div class="space-y-3">
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="w-full text-xs uppercase tracking-widest bg-red-600 text-white py-3 hover:bg-red-700 transition-colors">Da, obriši proizvod</button>
        </form>
        <a href="{% url 'product_detail' product.id %}" class="block w-full text-center text-xs uppercase tracking-widest border border-neutral-200 text-stone-500 py-3 hover:border-stone-400 hover:text-stone-900 transition-colors">Otkaži</a>
    </div>
</div>

{% endblock %}
