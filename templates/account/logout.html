{% extends "account/_page.html" %}
{% block page_title %}Odjava{% endblock %}
{% block heading %}Odjava{% endblock %}
{% block intro %}Da li želite da se odjavite?{% endblock %}
{% block body %}
<form method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    {{ redirect_field }}
    <button type="submit" class="w-full bg-stone-900 text-white text-xs uppercase tracking-widest py-3.5 hover:bg-stone-700 transition-colors">Odjavi se</button>
</form>
{% endblock %}
